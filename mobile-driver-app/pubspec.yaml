name: logistics_driver_app
description: Driver / Fleet Owner app - Smart Truck Booking & Logistics Platform
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  flutter_riverpod: ^2.5.1

  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  go_router: ^14.2.0

  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  # OpenStreetMap-tiled live tracking map (no API key/billing needed, unlike
  # Google Maps) - matches the customer app's booking_detail_screen.dart,
  # which uses the same pair for its live-tracking view.
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  # background_locator_2 removed: unused (we broadcast location via plain
  # geolocator + a foreground Timer in active_trip_screen.dart) and its
  # Android build.gradle depends on jcenter(), a repository shut down years
  # ago - incompatible with current Android Gradle Plugin/Gradle versions
  # and breaks the build outright.

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_auth: ^6.0.0

  intl: ^0.19.0
  # Poppins typography, matching the reference app's brand identity
  google_fonts: ^6.2.1
  pretty_dio_logger: ^1.3.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  # Re-added for pickup-document uploads (active_trip_screen.dart) - any
  # file type, not just images, so image_picker alone can't cover it.
  # Previously removed because its flutter_plugin_android_lifecycle
  # dependency needed compileSdk 36, which this project didn't have yet -
  # the Flutter tool's own default compileSdk is 36 now, so that's no
  # longer a blocker.
  file_picker: any
  # Barcode/QR scanning for proof-of-pickup confirmation. Pinned to at
  # least 6.0.0 (not the usual ^ from whatever's currently resolved) -
  # 5.2.3's bundled MLKit/CameraX native libs (libbarhopper_v3.so,
  # libimage_processing_util_jni.so) predate Google's 16 KB page size
  # support and get rejected by Play Console; 6.0.11+ pulls camera-core
  # 1.5.0 and play-services-mlkit-barcode-scanning 18.3.1+, which ship
  # 16 KB-aligned .so files.
  mobile_scanner: ^6.0.11
  # Native dialer for the customer call button
  url_launcher: ^6.3.1
  # Custom sound + a persistent notification for new job alerts (previously
  # just SystemSound + haptic, nothing left behind if missed)
  flutter_local_notifications: ^19.4.0
  # Real background GPS broadcast - a persistent foreground-service
  # notification keeps the app process (and its existing Socket.IO
  # connection) alive while a trip is active, even if the driver backgrounds
  # the app. background_locator_2 was removed earlier for an unrelated
  # broken-dependency reason; this is a different, actively maintained
  # package, not a resurrection of that one.
  flutter_foreground_task: ^8.17.0
  # Downloading + sharing the waybill PDF (identical pattern to the customer
  # app's booking_detail_screen.dart _downloadInvoice - bytes to a temp file,
  # then the native share sheet).
  path_provider: ^2.1.5
  share_plus: ^10.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates the actual app launcher icon set (all Android densities, iOS,
  # web) from assets/images/logo.png - run `dart run
  # flutter_launcher_icons` once after `flutter pub get` to apply it.
  flutter_launcher_icons: ^0.14.1

# path_provider_android pins jni to 1.0.1, which its own maintainers
# retracted from pub.dev (breaks the Gradle build with "Could not find
# method kotlin()") - force the fixed version instead. Same fix already
# applied in mobile-customer-app's pubspec.yaml.
dependency_overrides:
  jni: ^1.0.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_square.png" # fallback (legacy Android, iOS, web) - full amber square as shipped
  adaptive_icon_background: "#F7B500" # brand amber - matches AppTheme.amber
  adaptive_icon_foreground: "assets/images/icon_foreground.png" # icon mark only (no wordmark - illegible at launcher sizes), padded to Android's adaptive-icon safe zone
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_square.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  #   - assets/icons/
