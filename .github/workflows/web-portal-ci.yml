name: Web Portal CI

on:
  push:
    branches: [develop, main]
    paths: ['web-portal/**']
  pull_request:
    branches: [develop, main]
    paths: ['web-portal/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-portal/package-lock.json
      - run: npm install
      - run: npm run build
