# Production reverse proxy for raahmitr.com
#
# Four server blocks:
#   1. api.raahmitr.com         -> proxies to the Dockerized backend (port 5000,
#      bound to 127.0.0.1 only in docker-compose.yml - only nginx can reach it)
#   2. raahmitr.com              -> serves the public marketing site (website/,
#      a single static index.html, no build step)
#   3. admin.raahmitr.com        -> serves the Admin portal's static build
#   4. enterprise.raahmitr.com   -> serves the Enterprise portal's static build
#
# NOTE on the domain layout: the Admin portal used to sit at the raahmitr.com
# root (this file's git history has it that way). It moved to its own
# admin.raahmitr.com subdomain when the public website took the root slot -
# the website's nav "Admin Login" button already points at
# admin.raahmitr.com/login, so this is the config that makes that link real.
# This file is a template; it hasn't been applied to a live server yet, so
# this was a clean rename, not a migration - nothing to move on an actual
# VPS as part of this change.
#
# This file is HTTP-only (port 80) on purpose - run `certbot --nginx` after
# this is in place and DNS has propagated for raahmitr.com, api.raahmitr.com,
# admin.raahmitr.com, and enterprise.raahmitr.com. Certbot rewrites this file
# automatically to add the HTTPS server blocks and redirect HTTP -> HTTPS;
# don't hand-write the SSL directives yourself, since certbot manages the
# certificate paths and renewal hooks in a way that's easy to get subtly
# wrong by hand.

server {
    listen 80;
    server_name api.raahmitr.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        # Required for Socket.IO's WebSocket upgrade (live GPS tracking) -
        # without this, Socket.IO silently falls back to long-polling only.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name raahmitr.com www.raahmitr.com;

    # website/index.html is a single self-contained static file - no build
    # step, so this just needs the repo's website/ directory copied here
    # (or symlinked) as part of deploy, unlike the two React portals below.
    root /var/www/raahmitr/website;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name admin.raahmitr.com;

    # Path to web-portal-admin's built static files - update this if your
    # actual deployment path on the server differs.
    root /var/www/raahmitr/web-portal-admin-dist;
    index index.html;

    location / {
        # React Router (client-side routing) needs every unmatched path to
        # fall through to index.html, not 404 - the app's own router then
        # handles the actual path client-side.
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name enterprise.raahmitr.com;

    # Path to web-portal-enterprise's built static files - update this if
    # your actual deployment path on the server differs.
    root /var/www/raahmitr/web-portal-enterprise-dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
