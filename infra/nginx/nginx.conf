# Production reverse proxy for raahmitr.com
#
# Two server blocks:
#   1. api.raahmitr.com  -> proxies to the Dockerized backend (port 5000,
#      bound to 127.0.0.1 only in docker-compose.yml - only nginx can reach it)
#   2. raahmitr.com       -> serves the web-portal's static build directly
#
# This file is HTTP-only (port 80) on purpose - run `certbot --nginx` after
# this is in place and DNS has propagated for both raahmitr.com and
# api.raahmitr.com. Certbot rewrites this file automatically to add the
# HTTPS server blocks and redirect HTTP -> HTTPS; don't hand-write the SSL
# directives yourself, since certbot manages the certificate paths and
# renewal hooks in a way that's easy to get subtly wrong by hand.

server {
    listen 80;
    server_name api.raahmitr.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        # Required for Socket.IO's WebSocket upgrade (live GPS tracking) -
        # without this, Socket.IO silently falls back to long-polling only.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name raahmitr.com www.raahmitr.com;

    # Path to the web-portal's built static files - update this if your
    # actual deployment path on the server differs.
    root /var/www/raahmitr/web-portal-dist;
    index index.html;

    location / {
        # React Router (client-side routing) needs every unmatched path to
        # fall through to index.html, not 404 - the app's own router then
        # handles the actual path client-side.
        try_files $uri $uri/ /index.html;
    }
}
