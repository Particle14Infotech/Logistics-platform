# Production reverse proxy for raahmitr.com
#
# Three server blocks:
#   1. api.raahmitr.com         -> proxies to the Dockerized backend (port 5000,
#      bound to 127.0.0.1 only in docker-compose.yml - only nginx can reach it)
#   2. raahmitr.com              -> serves the Admin portal's static build
#   3. enterprise.raahmitr.com   -> serves the Enterprise portal's static build
#
# NOTE on the deploy path rename: web-portal/ was split into web-portal-admin/
# and web-portal-enterprise/ (two separately built/deployed apps instead of
# one combined one). Block #2's root below changed from web-portal-dist to
# web-portal-admin-dist to match - if a previous deploy already has files at
# the old web-portal-dist path on the actual VPS, either rename that
# directory to web-portal-admin-dist or update this path back, then deploy
# web-portal-enterprise's build to the new path used by block #3. This file
# is a template; it hasn't been applied to the live server yet.
#
# This file is HTTP-only (port 80) on purpose - run `certbot --nginx` after
# this is in place and DNS has propagated for raahmitr.com, api.raahmitr.com,
# and enterprise.raahmitr.com. Certbot rewrites this file automatically to
# add the HTTPS server blocks and redirect HTTP -> HTTPS; don't hand-write
# the SSL directives yourself, since certbot manages the certificate paths
# and renewal hooks in a way that's easy to get subtly wrong by hand.

server {
    listen 80;
    server_name api.raahmitr.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        # Required for Socket.IO's WebSocket upgrade (live GPS tracking) -
        # without this, Socket.IO silently falls back to long-polling only.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name raahmitr.com www.raahmitr.com;

    # Path to web-portal-admin's built static files - update this if your
    # actual deployment path on the server differs.
    root /var/www/raahmitr/web-portal-admin-dist;
    index index.html;

    location / {
        # React Router (client-side routing) needs every unmatched path to
        # fall through to index.html, not 404 - the app's own router then
        # handles the actual path client-side.
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name enterprise.raahmitr.com;

    # Path to web-portal-enterprise's built static files - update this if
    # your actual deployment path on the server differs.
    root /var/www/raahmitr/web-portal-enterprise-dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
