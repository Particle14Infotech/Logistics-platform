version: '3.8'

# Production compose file. Two fixes from the original scaffold:
# 1. Port alignment - backend/.env's PORT must be 5000 to match this file's
#    mapping and the Dockerfile's EXPOSE 5000 (the dev .env had PORT=5050,
#    which only matched local-machine testing, not this container setup).
# 2. No local 'mongo'/'redis' services - the real data already lives in an
#    external MongoDB Atlas cluster (backend/.env's MONGO_URI points there
#    directly), and Redis is never actually referenced anywhere in the
#    backend source, so both would just be unused/misleading containers.
# Also removed the dev-only bind-mount volumes (../../backend:/app) - those
# override the image's built code with whatever's on the host disk, which
# is meant for hot-reload during development, not production. This runs
# whatever was actually baked into the image at build time.

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      - '127.0.0.1:5000:5000' # bound to localhost only - nginx proxies to it, not exposed directly to the internet
    env_file:
      - ../../backend/.env
    volumes:
      # Driver KYC docs/selfies (driver.controller.js) are saved to local
      # disk via multer - without this volume they live only inside the
      # container's writable layer and are wiped on every `docker compose up
      # --build` / image rebuild. Named volume, not a bind mount, so it
      # survives independently of the host path.
      - uploads_data:/app/uploads

volumes:
  uploads_data:
