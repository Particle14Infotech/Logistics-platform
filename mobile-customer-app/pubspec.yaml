name: logistics_customer_app
description: Customer (Shipper) app - Smart Truck Booking & Logistics Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # Routing
  go_router: ^14.2.0

  # Maps & location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  # NOTE: no google_places_flutter package - Places Autocomplete is called
  # directly via Dio against Google's REST API (services/places_service.dart)
  # rather than a third-party widget wrapper, so the exact request/response
  # shape is Google's stable, documented REST contract rather than a
  # package API we'd need to verify against an installed version.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Auth/local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Payments
  razorpay_flutter: ^1.3.7

  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.3

  # Utilities
  intl: ^0.19.0
  # Poppins typography, matching the reference app's brand identity
  google_fonts: ^6.2.1
  pretty_dio_logger: ^1.3.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates the actual app launcher icon set (all Android densities, iOS,
  # web) from assets/images/logo.png - run `dart run
  # flutter_launcher_icons` once after `flutter pub get` to apply it.
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_square.png" # fallback (legacy Android, iOS, web) - full purple square as shipped
  adaptive_icon_background: "#673AB7" # brand purple - matches AppTheme.primary
  adaptive_icon_foreground: "assets/images/icon_foreground.png" # icon mark only (no wordmark - illegible at launcher sizes), padded to Android's adaptive-icon safe zone
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_square.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  #   - assets/icons/
