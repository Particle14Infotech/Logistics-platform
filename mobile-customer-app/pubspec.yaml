name: logistics_customer_app
description: Customer (Shipper) app - Smart Truck Booking & Logistics Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # Routing
  go_router: ^14.2.0

  # Maps & location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  google_places_flutter: ^2.0.9

  # Auth/local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Payments
  razorpay_flutter: ^1.3.7

  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.3

  # Utilities
  intl: ^0.19.0
  pretty_dio_logger: ^1.3.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
