name: logistics_customer_app
description: Customer (Shipper) app - Smart Truck Booking & Logistics Platform
publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  socket_io_client: ^3.1.2

  # Routing
  go_router: ^16.2.0

  # Maps & Location
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Payments
  razorpay_flutter: ^1.4.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  firebase_analytics: ^12.0.0

  # Local Notifications
  flutter_local_notifications: ^19.4.0

  # Utilities
  intl: ^0.20.2
  google_fonts: ^6.3.1
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  # Pickup QR code (order id) shown for the driver to scan - previously the
  # driver-side scan wasn't validated against anything at all.
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

# path_provider_android pins jni to 1.0.1, which its own maintainers
# retracted from pub.dev (breaks the Gradle build with "Could not find
# method kotlin()") - force the fixed version instead.
dependency_overrides:
  jni: ^1.0.3

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo_square.png"

  adaptive_icon_background: "#673AB7"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/images/logo_square.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/vehicles/