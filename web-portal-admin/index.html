<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raah Mitr | Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Plain CSS, not Tailwind - this has to render before the app's own
         bundle (which is what's slow to arrive on a cross-subdomain first
         visit) finishes loading, so it can't depend on anything that
         bundle provides. React replaces #root's content wholesale on
         mount, so this never lingers once the real app is ready. -->
    <style>
      #boot-shell {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #F8FAFC; font-family: system-ui, -apple-system, sans-serif;
      }
      #boot-shell .mark {
        width: 44px; height: 44px; border-radius: 12px; background: #673AB7;
        display: flex; align-items: center; justify-content: center;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-shell span { font-size: 13px; color: #64748B; letter-spacing: 0.02em; }
      @keyframes boot-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { #boot-shell .mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div class="mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 16h1.8M3 16v-5.2A1 1 0 0 1 4 10h6.5v6M3 16a1.6 1.6 0 1 0 3.2 0m-3.2 0a1.6 1.6 0 1 1 3.2 0m0 0h5m0 0a1.6 1.6 0 1 0 3.2 0m-3.2 0a1.6 1.6 0 1 1 3.2 0m0 0H20v-3.1a1 1 0 0 0-.3-.7l-2.2-2.2a1 1 0 0 0-.7-.3H14.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span>Loading admin console…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
